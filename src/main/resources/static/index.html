<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Blueprints</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <script src="/webjars/jquery/jquery.min.js"></script>
        <script src="/webjars/bootstrap/3.3.7-1/js/bootstrap.min.js"></script>
        <link rel="stylesheet"
          href="/webjars/bootstrap/3.3.7-1/css/bootstrap.min.css" />
    </head>
<body>
    <h1>Blueprints</h1>
<label for="author">Author:</label>
<input type="text" id="author" name="author" placeholder="Enter author name">
<button class="btn btn-success" onclick="Module.updateAuthor()">Get Blueprints</button>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Names</th>
            <th>Number of Points</th>
            <th>Open</th>
        </tr>
    </thead>
    <tbody id="blueprints-table"></tbody>
</table>

<!-- Canvas para visualizar los blueprints -->
<canvas id="blueprint-canvas" width="500" height="500" style="border:1px solid black;"></canvas>

<script src="js/app.js"></script>

</body>

</html>
